name: Test TenderNed

on:
  workflow_dispatch:
    inputs:
      aantal:
        description: "Aantal publicaties (1-100)"
        default: "10"

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aanbestedingen ophalen
        env:
          AANTAL_PUBLICATIES: ${{ github.event.inputs.aantal || '10' }}
        run: python tenderned.py

      - name: Resultaten beschikbaar maken
        if: always()   # ook uploaden als het script faalt, zodat je de log kunt bekijken
        uses: actions/upload-artifact@v4
        with:
          name: aanbestedingen-nederland
          path: |
            aanbestedingen_nederland.csv
            aanbestedingen_nederland.json
            tenderned.log
          if-no-files-found: warn
