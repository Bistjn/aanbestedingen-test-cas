name: Aanbestedingen ophalen

on:
  workflow_dispatch:
    inputs:
      dagen_terug:
        description: "Publicaties van de laatste X dagen ophalen"
        default: "1"
      alleen_matching:
        description: "Alleen de matchscores opnieuw berekenen (geen nieuwe publicaties ophalen)"
        type: boolean
        default: false
  schedule:
    # Elke dag om 05:47 UTC (= 06:47 in België in de winter, 07:47 in de zomer)
    - cron: "47 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aanbestedingen
  cancel-in-progress: false

env:
  SITE_URL: https://bistjn.github.io/aanbestedingen-test-cas

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: AI-taalmodel installeren (voor de matchscores)
        run: pip install -r requirements.txt

      - name: AI-taalmodel uit de cache halen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1

      - name: Gegevens van vorige dagen ophalen (van de live pagina)
        run: |
          mkdir -p data
          for bestand in aanbestedingen.json; do
            if curl -fsSL "$SITE_URL/data/$bestand" -o "data/$bestand"; then
              echo "Eerdere gegevens opgehaald: $bestand"
            else
              echo "Nog geen eerdere $bestand (eerste keer?)."
              rm -f "data/$bestand"
            fi
          done

      - name: TenderNed (Nederland)
        id: tenderned
        if: ${{ !inputs.alleen_matching }}
        continue-on-error: true   # een fout bij TenderNed mag TED niet tegenhouden
        env:
          TENDERNED_DAGEN_TERUG: ${{ github.event.inputs.dagen_terug || '1' }}
          TENDERNED_MAX: "1200"
        run: python tenderned.py

      - name: TED (Europa - Belgie en Nederland)
        id: ted
        if: ${{ !inputs.alleen_matching }}
        continue-on-error: true
        env:
          TED_DAGEN_TERUG: ${{ github.event.inputs.dagen_terug || '1' }}
          TED_MAX: "3000"
        run: python ted.py

      - name: Overzicht maken
        id: overzicht
        run: python overzicht.py

      - name: Website klaarzetten
        run: |
          mkdir -p site/data
          cp overzicht.html site/index.html
          cp data/aanbestedingen.json site/data/aanbestedingen.json

      - name: Website uploaden voor GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Resultaten beschikbaar maken
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aanbestedingen-${{ github.run_number }}
          path: |
            overzicht.html
            data/aanbestedingen.json
            *.csv
            *.json
            *.log
          if-no-files-found: warn

      - name: Run als mislukt markeren als een bron faalde
        if: steps.tenderned.outcome == 'failure' || steps.ted.outcome == 'failure'
        run: |
          echo "TenderNed: ${{ steps.tenderned.outcome }} | TED: ${{ steps.ted.outcome }}"
          exit 1

  publiceren:
    # Alleen vanaf main publiceren; testbranches maken wel de pagina, maar zetten ze niet online
    # !cancelled(): ook publiceren als één bron faalde (de andere bron is dan wel bijgewerkt)
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: ophalen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
